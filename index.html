<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes: French card battler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#E4E9F3;--surface:#F6F8FC;--ink:#151E3F;--muted:#566184;--line:#C3CBDF;
  --hp:#C2352B;--xp:#D9A514;--good:#2C7A54;--bad:#C2352B;--shadow:#151E3F;
  --paper:#FBF6E9;--paper-ink:#171F40;
  --k-v:#C2352B;--k-l:#2A4BA0;--k-g:#D9A514;--k-w:#3A3F6B;--k-s:#2C7A54;--k-r:#1F7F8A;
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fr:"Alegreya",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10173A;--surface:#1A2452;--ink:#EDF0FA;--muted:#9CA7CC;--line:#313D78;
  --hp:#F0685C;--xp:#F2C744;--good:#5FC08F;--bad:#F0685C;--shadow:#050818;--paper:#F3EDDC;}}
:root[data-theme="dark"]{
  --bg:#10173A;--surface:#1A2452;--ink:#EDF0FA;--muted:#9CA7CC;--line:#313D78;
  --hp:#F0685C;--xp:#F2C744;--good:#5FC08F;--bad:#F0685C;--shadow:#050818;--paper:#F3EDDC;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--k-l);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px;min-height:100%}
#app.full{padding-bottom:16px;display:flex;flex-direction:column;height:100%}
h1{font:800 28px/1.1 var(--ui);margin:0 0 4px;letter-spacing:-.02em}
h2{font:800 19px/1.2 var(--ui);margin:28px 0 10px;letter-spacing:-.01em}
p{margin:0 0 10px}
small,.muted{color:var(--muted);font-size:14px}
.fr{font-family:var(--fr)}

/* bars */
.top{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat b{font:800 22px/1 var(--ui)}
.stat .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bar{height:12px;border:2px solid var(--ink);border-radius:3px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);transition:width .3s}
.bar.hp i{background:var(--hp)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border:2px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;min-height:44px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}
.rowbtns .btn{flex:1}

/* boss panel */
.bosspanel{display:grid;grid-template-columns:124px 1fr;gap:16px;align-items:center;margin-top:22px;padding:14px;background:var(--surface);border:2px solid var(--ink);border-radius:8px}
.tarot{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);padding:6px;display:flex;flex-direction:column;aspect-ratio:5/8;text-align:center}
.tarot .num{font:700 13px/1 var(--fr)}
.tarot .glyph{flex:1;display:flex;align-items:center;justify-content:center;margin:5px 0;border:2px solid var(--paper-ink);background:var(--k-l);color:var(--paper);font:italic 500 46px/1 var(--fr);overflow:hidden}
.tarot .nm{font:700 13px/1.15 var(--fr)}
.tarot.b6 .glyph{background:var(--paper-ink)}.tarot.b7 .glyph{background:var(--xp);color:var(--paper-ink)}
.tarot.b1 .glyph{background:var(--k-v)}.tarot.b2 .glyph{background:var(--k-g);color:var(--paper-ink)}.tarot.b3 .glyph{background:var(--k-s)}.tarot.b4 .glyph{background:var(--k-w)}.tarot.b5 .glyph{background:var(--k-r)}

/* plan */
.strip{margin-top:18px;padding:12px 14px;background:var(--surface);border:2px solid var(--ink);border-radius:8px}
.strip .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tag.done{background:var(--good);color:var(--bg);border-color:var(--good)}
.tl{display:flex;gap:4px;margin:14px 0 6px}
.tl div{border:2px solid var(--ink);border-radius:4px;background:var(--surface);padding:6px 6px 8px;font-size:12px;line-height:1.25;position:relative;overflow:hidden;min-width:0}
.tl div b{display:block;font-size:13px;overflow-wrap:anywhere}
.tl div i{position:absolute;left:0;bottom:0;height:5px;background:var(--xp)}
.tl div.now{box-shadow:3px 3px 0 var(--shadow)}
.q{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.q small{font-variant-numeric:tabular-nums}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:6px 0 12px}
.chks.one{grid-template-columns:1fr}
.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:14px;margin:0;padding:6px 0;min-height:36px}
.chk input{width:20px;height:20px;flex:0 0 auto;margin:0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:4px;text-align:left;font-weight:600;white-space:nowrap}
td input.sc{width:72px;padding:8px 6px;font-size:14px;border-width:1.5px}
.steps{padding-left:20px;margin:6px 0}
/* lessons + map */
.deckbar i{background:var(--k-l)}
.mini{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:18px;padding:12px 14px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;text-align:left}
.mini .mt b{display:block}.mini .mt small{color:var(--muted)}
.dots{display:flex;gap:6px;position:relative;flex-wrap:wrap;justify-content:flex-end}
.dots i{font-style:normal;width:26px;height:26px;border-radius:50%;border:2px solid var(--pc);background:var(--surface);font:700 12px/22px var(--ui);text-align:center}
.dots i.done{background:var(--pc);color:var(--bg)}.dots i.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--pc)}.dots i.locked{border-color:var(--line);color:var(--muted)}
.learn{padding:12px 14px;border-left:6px solid var(--pc);background:var(--surface);border-radius:0 8px 8px 0}
.topics{margin:4px 0 0;padding-left:20px}.topics li{margin:2px 0;font-weight:600}
.lessons{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--ink);border-left-width:10px;border-radius:6px;padding:10px 12px;min-height:60px}
.lrow .g{flex:1;min-width:0}.lrow b{display:block}.lrow small{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.lp{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.lp.ok{color:var(--good)}
.lrow[disabled]{opacity:.5}
.map{position:relative;margin:14px 0 8px}
.map svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.map path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round;vector-effect:non-scaling-stroke}
.map path.lit{stroke-dasharray:none}
.pb{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;z-index:1}
.pb>i{flex:0 0 14px;height:14px;border-radius:50%;background:var(--pc)}
.pb b{display:block;font-size:15px}.pb small{color:var(--muted);font-size:13px}
.pb .g{flex:1;min-width:0}
.pbs{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.nd{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;border:3px solid var(--pc);background:var(--surface);color:var(--ink);font:800 20px/1 var(--ui);padding:0;z-index:2;display:flex;align-items:center;justify-content:center}
.nd.done{background:var(--pc);color:var(--pt)}
.nd.done i{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 13px/24px var(--ui);font-style:normal}
.nd.cur{width:74px;height:74px;font-size:26px;border-width:5px;box-shadow:4px 4px 0 var(--shadow)}
.nd.cur::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid var(--pc);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}80%,100%{transform:scale(1.15);opacity:0}}
.nd.locked{border-color:var(--line);color:var(--muted)}
.nl{position:absolute;transform:translateY(-50%);font-size:14px;line-height:1.25;max-width:240px}
.nl.l{text-align:right}.nl.r{left:auto}
.nl b{display:block;font-size:15px}.nl span{display:block}.nl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nl.locked{opacity:.6}
.here{display:inline-block;font-style:normal;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:20px;padding:1px 9px;margin-bottom:3px}
.scrim{position:fixed;inset:0;background:rgba(21,30,63,.4);z-index:30}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:78vh;overflow:auto;background:var(--surface);border:2px solid var(--ink);border-bottom:0;border-top:8px solid var(--pc);border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:31}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sh b{display:block;font-size:22px}.sh small{color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1;min-height:0}
.tile{text-align:left;background:var(--surface);border:2px solid var(--ink);border-left-width:10px;border-radius:6px;padding:10px 12px;min-height:104px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:17px}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.tile em{font-style:normal;font-size:13px;font-weight:600;margin-top:auto}
.tile[disabled]{opacity:.5}
.e-v{border-left-color:var(--k-v)}.e-l{border-left-color:var(--k-l)}.e-g{border-left-color:var(--k-g)}.e-w{border-left-color:var(--k-w)}.e-s{border-left-color:var(--k-s)}.e-r{border-left-color:var(--k-r)}

/* playing cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.card{position:relative;text-align:left;width:100%;min-height:172px;background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:8px;box-shadow:3px 3px 0 var(--shadow);padding:0;display:flex;flex-direction:column;overflow:hidden}
.card .cn{display:block;padding:8px 8px 8px 36px;font:700 16px/1.1 var(--fr);color:var(--paper);background:var(--k-v);min-height:38px}
.card .cost{position:absolute;left:5px;top:5px;width:26px;height:26px;border-radius:50%;background:var(--paper);border:2px solid var(--paper-ink);font:800 14px/22px var(--ui);text-align:center}
.card .cd{padding:8px;font-size:13px;line-height:1.3;flex:1}
.card .ck{padding:0 8px 7px;font-size:11px;opacity:.7}
.card.k-l .cn{background:var(--k-l)}.card.k-g .cn{background:var(--k-g);color:var(--paper-ink)}.card.k-w .cn{background:var(--k-w)}.card.k-s .cn{background:var(--k-s)}.card.k-r .cn{background:var(--k-r)}
.card.r1{outline:2px solid var(--paper-ink);outline-offset:-6px}
.card.r2{outline:3px double var(--k-g);outline-offset:-7px}
.card.dim{opacity:.45}
.card:not(.dim):active{transform:translateY(-4px)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;z-index:5}
#nav button{flex:1;max-width:130px;background:none;border:0;padding:8px 4px 10px;font-size:13px;font-weight:600;color:var(--muted);min-height:56px}
#nav button i{display:block;font-style:normal;font-size:18px;line-height:1.2}
#nav button.on{color:var(--ink)}
#nav.hide{display:none}

/* forms */
input[type=text],textarea,select{width:100%;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:12px;font-size:17px}
textarea{min-height:150px;font-size:15px;line-height:1.4}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
pre{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:10px;font-size:13px;overflow-x:auto;margin:8px 0}
details{margin:10px 0}summary{font-weight:600;min-height:44px;display:flex;align-items:center;cursor:pointer}
.list{border:2px solid var(--ink);border-radius:6px;background:var(--surface)}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.list>div.today{box-shadow:inset 8px 0 0 var(--xp);padding-left:18px}
.list .g{flex:1;min-width:0}
.list input[type=checkbox]{width:22px;height:22px}
.notice{border:2px solid var(--hp);border-radius:6px;padding:12px;margin:16px 0 0;background:var(--surface)}
.err{color:var(--bad);font-size:14px}

/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{width:44px;height:44px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);font-size:18px}
.pips{flex:1;display:flex;gap:5px}
.pips i{flex:1;height:8px;border:2px solid var(--ink);border-radius:2px;background:var(--surface)}
.pips i.cur{background:var(--ink)}.pips i.good{background:var(--good)}.pips i.bad{background:var(--bad)}
.prompt{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-ink);border-radius:8px;box-shadow:4px 4px 0 var(--shadow);padding:18px 16px;margin-bottom:16px}
.prompt .ask{font-size:14px;opacity:.75;margin-bottom:6px}
.prompt .big{font:700 26px/1.2 var(--ui);overflow-wrap:anywhere}
.prompt .big.fr.free{font-size:23px}
.prompt .big.fr{font:700 30px/1.2 var(--fr)}
.prompt .chip{display:inline-block;margin-top:10px;font-size:12px;border:1px solid var(--paper-ink);border-radius:20px;padding:2px 10px}
.prompt .btn{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.acc{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px}
.acc button{flex:0 0 auto;min-width:40px;height:40px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);font:500 18px var(--fr)}
.fb{border:2px solid var(--good);border-radius:6px;padding:12px;margin:14px 0;background:var(--surface)}
.fb.no{border-color:var(--bad)}
.fb b{display:block;font-size:18px;margin-bottom:4px}
.fb .a{font:700 20px/1.25 var(--fr)}
.center{text-align:center}
.spacer{flex:1}

/* battle */
.arena{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
.arena.hit .tarot{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.intent{font-weight:600;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:var(--surface);margin:8px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:20px;padding:1px 9px;background:var(--surface)}
.msg{min-height:44px;font-size:14px;color:var(--muted);margin:10px 0}
.me{border-top:2px solid var(--ink);padding-top:10px}
.pipsE{font-size:20px;letter-spacing:3px;color:var(--xp)}
.hand{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
.hand .card{flex:0 0 124px;width:124px}
.over{background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:18px;margin-top:14px}
.quiz{margin-top:4px;padding:14px;border:2px solid var(--ink);border-radius:8px;background:var(--surface)}
.quiz.def{border-color:var(--hp);box-shadow:inset 0 6px 0 var(--hp)}
.quiz.atk{box-shadow:inset 0 6px 0 var(--k-l)}
.qk{font-weight:600;font-size:14px;margin:4px 0 8px}
.qa{color:var(--muted);font-size:14px;margin:0 0 2px}
.qb{font:700 22px/1.25 var(--ui);margin:0 0 8px;overflow-wrap:anywhere}.qb.fr{font:700 24px/1.25 var(--fr)}
.qo{display:grid;gap:8px;margin-top:10px}
.qo button{text-align:left;min-height:48px;padding:10px 12px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);font-size:16px;line-height:1.3}
.qo button.fr{font-family:var(--fr);font-size:18px}
.qo button.right{background:var(--good);border-color:var(--good);color:var(--bg)}
.qo button.wrong{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qo button[disabled]{cursor:default}
.qr{margin:12px 0 10px}
/* reading */
.rtext h1{font:700 30px/1.15 var(--fr);margin:2px 0 12px}
.rbody{font-size:20px;line-height:1.6;margin:12px 0 18px}
.rbody p{margin:0 0 14px}
.gl{display:inline;font:inherit;color:inherit;background:none;border:0;padding:0 1px;border-bottom:2px dotted var(--k-l);border-radius:0;cursor:pointer}
.gl.on{background:var(--k-l);color:var(--bg);border-bottom-color:var(--k-l);border-radius:3px}
.glt{display:inline-block;font:400 15px/1.35 var(--ui);background:var(--surface);border:2px solid var(--k-l);border-radius:8px;padding:3px 9px;margin:2px 4px;vertical-align:baseline}
.glt b{font:700 16px var(--fr);margin-right:4px}.glt .link{min-height:0;padding:0 0 0 6px;font-size:14px}
.again{margin-top:22px}.again .rbody{font-size:18px}
.prompt .big.rq{font-size:24px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;max-width:90%;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ===== 00-util.js ===== */
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const uid6=()=>Math.random().toString(36).slice(2,9);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date());
const dayNum=s=>Math.round(Date.parse(s+'T12:00:00Z')/864e5);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}


/* ===== 10-game-data.js ===== */
/* ---------- game data ---------- */
const SK={
 l:{n:'Listening',d:'Hear French, type the meaning',gives:'Block cards'},
 g:{n:'Grammar',d:'Translate fresh sentences into French',gives:'Combo cards'},
 w:{n:'Writing',d:'Type the French for words, dictation, then a free answer',gives:'Attack cards or a cut'},
 s:{n:'Speaking',d:'Say words aloud, then answer a question',gives:'A weakening card'},
 r:{n:'Reading',d:'Read a short text, then answer questions',gives:'A support card'}};
let B=null; // battle

    Object.keys(it.s||{}).forEach(k=>{const e=(n.srs[id]=n.srs[id]||{});e[k]=better(e[k],it.s[k])})});
  (s.concepts||[]).forEach(c=>{const cc=COURSE.byName.get(norm(c.name));

function conjugationSrc(){

   ['apprendre','apprends apprends apprend apprenons apprenez apprennent','appris',0,['learn','learns','learned'],['le français','la leçon','la chanson'],['French','the lesson','the song']],
   ['avoir','ai as a avons avez ont','eu',0,['have','has','had'],['le temps','la clé','le livre'],['the time','the key','the book']],
   ['devoir','dois dois doit devons devez doivent','dû',0,['have to','has to','had to'],['travailler','partir','venir'],['work','leave','come']],
   ['être','suis es est sommes êtes sont','été',0,'be',['à Lausanne','à la maison','en retard'],['in Lausanne','at home','late']],
   ['faire','fais fais fait faisons faites font','fait',0,['do','does','did'],['le travail','la cuisine','le ménage'],['the work','the cooking','the housework']],
   ['pouvoir','peux peux peut pouvons pouvez peuvent','pu',0,'can',['venir','travailler','comprendre'],['come','work','understand']],
   ['venir','viens viens vient venons venez viennent','venu',1,['come','comes','came'],['de Roumanie','à Lausanne','ici'],['from Romania','to Lausanne','here']],
   ['voir','vois vois voit voyons voyez voient','vu',0,['see','sees','saw'],['le film','la mer','le problème'],['the film','the sea','the problem']],
   ['vouloir','veux veux veut voulons voulez veulent','voulu',0,['want to','wants to','wanted to'],['apprendre le français','partir','manger'],['learn French','leave','eat']]];
  const vow=f=>/^[aeiouéèêâîô]/i.test(f),cap=x=>x[0].toUpperCase()+x.slice(1);
  const subj=(p,f)=>p===0&&vow(f)?"j'"+f:P[p]+' '+f,ne=f=>(vow(f)?"n'":'ne ')+f+' pas';
  const fr=(v,t,neg,p)=>{const f=v[1].split(' ');
    if(t===0)return neg?P[p]+' '+ne(f[p]):subj(p,f[p]);
    if(t===1){const a=(v[3]?ET:AV)[p],pp=v[2]+(v[3]?AG[p]:'');return neg?P[p]+' '+ne(a)+' '+pp:subj(p,a+' '+pp)}

    if(t===1)return neg?`${s} didn't ${e[0]}`:`${s} ${e[2]}`;
    return `${s} ${BE[p]}${n} going to ${e[0]}`};
  let out='# list: Notes: conjugaison\n';
  [['Présent',0,0],['Présent, négation',0,1],['Passé composé',1,0],['Passé composé, négation',1,1],['Futur proche',2,0],['Futur proche, négation',2,1]].forEach(([name,t,neg])=>{

  });
  return out;
}

function frNum(n){
  const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'],T=['','','vingt','trente','quarante','cinquante','soixante'];
  if(n<17)return U[n];if(n<20)return 'dix-'+U[n-10];
  if(n<70){const t=T[Math.floor(n/10)],u=n%10;return u===0?t:u===1?t+' et un':t+'-'+U[u]}
  if(n<80)return n===71?'soixante et onze':'soixante-'+frNum(n-60);
  if(n<100)return n===80?'quatre-vingts':'quatre-vingt-'+frNum(n-80);
  if(n<1000){const h=Math.floor(n/100),r=n%100;return (h>1?U[h]+' ':'')+'cent'+(r?' '+frNum(r):h>1?'s':'')}
  const k=Math.floor(n/1000),r=n%1000;return (k>1?frNum(k)+' ':'')+'mille'+(r?' '+frNum(r):'');
}
function enNum(n){
  const U=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],T=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if(n<20)return U[n];if(n<100)return T[Math.floor(n/10)]+(n%10?'-'+U[n%10]:'');
  if(n<1000)return U[Math.floor(n/100)]+' hundred'+(n%100?' and '+enNum(n%100):'');
  return enNum(Math.floor(n/1000))+' thousand'+(n%1000?' '+enNum(n%1000):'');
}

/* ---------- bulk import ---------- */
function parseBulk(text,defLv,defList){
  const out={items:[],concepts:[],errors:[]};text=(text||'').trim();if(!text)return out;
  if(text[0]==='['){
    try{JSON.parse(text).forEach((o,i)=>{
      if(o&&o.fr&&o.en)out.items.push({fr:String(o.fr),en:String(o.en),lv:o.level||defLv,list:o.list||defList,day:+o.day||0});
      else if(o&&o.concept)out.concepts.push({name:String(o.concept),lv:o.level||defLv,list:o.list||defList,day:+o.day||0,t:(o.templates||[]).filter(t=>t.fr&&t.en).map(t=>[t.fr,t.en])});
      else out.errors.push('Entry '+(i+1)+' needs "fr" and "en", or "concept".');
    })}catch(e){out.errors.push('That JSON could not be read: '+e.message)}
    return out;
  }
  let lv=defLv,list=defList,cur=null,day=0;
  text.split(/\r?\n/).forEach((raw,i)=>{
    const line=raw.trim();let m;
    if(!line){cur=null;return}
    if(m=line.match(/^##\s*(.+)$/)){cur={name:m[1].trim(),lv,list,day,t:[]};out.concepts.push(cur);return}
    if(m=line.match(/^#\s*(level|list|day)\s*:\s*(.+)$/i)){const k=m[1].toLowerCase();if(k==='level')lv=m[2].trim();else if(k==='list')list=m[2].trim();else day=parseInt(m[2])||0;cur=null;return}
    if(line[0]==='#')return;
    let p=line.indexOf('\t'),w=1;if(p<0){p=line.indexOf(' = ');w=3}if(p<0){p=line.indexOf('=');w=1}
    const fr=p<0?'':line.slice(0,p).trim(),en=p<0?'':line.slice(p+w).trim();
    if(!fr||!en){out.errors.push(`Line ${i+1}: expected “français = english”.`);return}
    if(cur){
      const a=[...fr.matchAll(/\{([^}]*)\}/g)].map(x=>x[1].split('|').length),b=[...en.matchAll(/\{([^}]*)\}/g)].map(x=>x[1].split('|').length);
      if(a.length!==b.length||a.some((n,j)=>n!==b[j])){out.errors.push(`Line ${i+1}: the {choices} on both sides need the same number of slots and options.`);return}
      cur.t.push([fr,en]);
    }else out.items.push({fr,en,lv,list,day});
  });
  return out;
}
/* Your own imports go to state.mine. Words already in the course are skipped (their flashcards already exist). */
function addBulk(r){
  let ni=0,nc=0,dup=0;const M=state.mine;
  r.items.forEach(o=>{if(COURSE.byFr.has(norm(o.fr))||M.items.some(i=>norm(i.fr)===norm(o.fr))){dup++;return}
    M.items.push(bindItem({id:'u:'+slug(o.list||'My words')+':'+slug(o.fr),fr:o.fr,en:o.en,lv:o.lv||'',list:o.list||'My words',day:o.day||0}));ni++});
  r.concepts.forEach(c=>{if(COURSE.byName.has(norm(c.name))){dup++;return}
    const ex=M.concepts.find(x=>norm(x.name)===norm(c.name));
    if(ex){if(c.day)ex.day=c.day;c.t.forEach(t=>{if(!ex.t.some(u=>u[0]===t[0]))ex.t.push(t)})}
    else{M.concepts.push(bindConcept({id:'uc:'+slug(c.name),name:c.name,lv:c.lv||'',list:c.list||'My words',day:c.day||0,t:c.t}));nc++}});
  return {ni,nc,dup};
}
function expand(fr,en){
  const re=/\{([^}]*)\}/g,picks=[...fr.matchAll(re)].map(m=>Math.floor(Math.random()*m[1].split('|').length));
  let i=0;const f=fr.replace(re,(_,g)=>g.split('|')[picks[i++]].trim());i=0;
  const e=en.replace(re,(_,g)=>{const a=g.split('|');return (a[picks[i++]]??a[0]).trim()});
  return {fr:f.replace(/\s+/g,' '),en:e.replace(/\s+/g,' ')};
}

Depuis quelques années, de plus en plus d'employés travaillent à la maison un ou deux jours par semaine. Le télétravail est-il une bonne chose ? Les avis sont partagés.

Pour ses défenseurs, il n'y a que des avantages. On ne perd plus de temps dans les transports, on organise sa journée comme on veut et on peut mieux concilier vie professionnelle et vie privée. Selon une étude récente, les télétravailleurs seraient même plus productifs.

Pourtant, d'autres sont plus critiques. Ce qui manque le plus, disent-ils, ce sont les contacts humains. En travaillant seul chez soi, on se sent parfois isolé, et il devient difficile de séparer le travail du reste de la vie. Bien que l'ordinateur soit éteint, on pense encore aux e-mails.

/* ===== 28-course-build.js ===== */
/* ---------- course: build ----------
   Turns the course files (21–26) into one structure the app reads:
     COURSE.items     every word and phrase, with a stable id ("v:" + its French), the day it starts, and its list
     COURSE.concepts  every grammar concept, with a stable id ("c:" + its name) and the day it unlocks
     COURSE.texts     the reading texts, one or two per day
   Course content lives here, not in saved data, so fixing a translation or adding a text reaches every save.
   Saved data only refers to these ids (flashcard history, concepts switched off). */
let COURSE=null;
const slug=s=>strip(norm(s)).replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);
const NOS=Object.freeze({});
/* Finds a glossary form in a text: whole words only, any case; a form ending in an apostrophe ("qu'") may touch the next word. */
function glossRe(s){return new RegExp('(?<![\\p{L}\\u0000-\\u0002])'+s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(/['’]$/.test(s)?'':'(?![\\p{L}])'),'iu')}
/* "le lac" is also looked for as "lac", so "près du lac" still links to it. */
const ARTICLE=/^(?:(?:le|la|les|un|une|des|du|au|aux|de la) |l['’])/i;
/* Flashcard history lives in state.srs[id]; each item reads it through `it.s` (never saved with the item). */
function bindItem(it){if(!Object.getOwnPropertyDescriptor(it,'s'))Object.defineProperty(it,'s',{get(){return (state&&state.srs[it.id])||NOS},enumerable:false,configurable:true});return it}
/* A concept is "on" unless the learner switched it off (state.off[id]). */
function bindConcept(c){if(!Object.getOwnPropertyDescriptor(c,'on'))Object.defineProperty(c,'on',{get(){return !(state&&state.off[c.id])},set(v){if(v)delete state.off[c.id];else state.off[c.id]=true},enumerable:false,configurable:true});return c}

/* Reading texts are written in a small plain format, see 26-course-texts.js. */
function parseTexts(src){
  const out=[];
  src.split(/^@@/m).slice(1).forEach(block=>{
    const lines=block.split('\n'),head=lines.shift().split('|').map(s=>s.trim());
    const t={id:'t'+head[0],day:parseInt(head[0]),title:head[1],paras:[],gloss:[],qs:[],write:null};
    let sec='text',buf=[];
    const flush=()=>{if(buf.length){t.paras.push(buf.join(' '));buf=[]}};
    lines.forEach(raw=>{const line=raw.trim();
      if(/^--\s*\w+/.test(line)){flush();sec=line.replace(/^--\s*/,'').toLowerCase();return}
      if(sec==='text'){if(!line)flush();else buf.push(line);return}
      if(!line)return;
      if(sec==='gloss'){const [l,e]=line.split(' = ');const [m,f]=l.includes('|')?l.split('|').map(s=>s.trim()):[l.trim(),l.trim()];t.gloss.push({m,alt:m.replace(ARTICLE,''),f,e:(e||'').trim()})}
      else if(sec==='questions'){const p=line.split('|').map(s=>s.trim()),q={q:p[0],o:[],c:0};p.slice(1).forEach(o=>{if(o[0]==='*'){q.c=q.o.length;o=o.slice(1).trim()}q.o.push(o)});t.qs.push(q)}
      else if(sec==='write'){const p=line.split('|').map(s=>s.trim());t.write={fr:p[0],en:p[1]||''}}
    });
    flush();out.push(t);
  });
  return out;
}

function buildCourse(){
  const items=new Map(),concepts=new Map(),problems=[];
  const addItem=(o,list,day)=>{const id='v:'+slug(o.fr);if(!id||id==='v:')return;const ex=items.get(id);
    if(ex){if(day&&(!ex.day||day<ex.day))ex.day=day;return ex}
    const it=bindItem({id,fr:o.fr,en:o.en,day:day||0,list,course:true});items.set(id,it);return it};
  const addSrc=src=>{const r=parseBulk(src,'','Course');r.errors.forEach(e=>problems.push(e));
    r.items.forEach(o=>addItem(o,o.list,o.day));
    r.concepts.forEach(c=>{const id='c:'+slug(c.name),ex=concepts.get(id);
      if(ex){c.t.forEach(t=>{if(!ex.t.some(u=>u[0]===t[0]))ex.t.push(t)});if(c.day&&(!ex.day||c.day<ex.day))ex.day=c.day}
      else concepts.set(id,bindConcept({id,name:c.name,day:c.day||0,list:c.list,t:c.t.slice(),course:true}))})};
  [STARTER_CONCEPTS,conjugationSrc(),NOTE_CONCEPTS,numbersBulk(),GRAMMAR,VOCAB,MY_WORDS].forEach(addSrc);
  const texts=parseTexts(TEXTS);
  texts.forEach(t=>{t.gloss.forEach(g=>{g.item=addItem({fr:g.f,en:g.e},`Texte, jour ${t.day}: ${t.title}`,t.day)});
    if(t.qs.some(q=>q.o.length<2))problems.push('Text '+t.id+' has a question with fewer than 2 options');});

const slotsOf=t=>[...t.matchAll(/\{([^}]*)\}/g)].map(m=>m[1].split('|'));

function mcqGrammar(){
  const cs=studied().filter(c=>c.t.some(t=>slotsOf(t[0]).length));if(!cs.length)return null;
  const nt=cs.filter(c=>c.day===planDay()),c=nt.length&&Math.random()<.5?rnd(nt):rnd(cs),t=rnd(c.t.filter(t=>slotsOf(t[0]).length)),S=slotsOf(t[0]),p=S.map(a=>Math.floor(Math.random()*a.length));

  const tryAdd=q=>{const f=fillT(t[0],q),e=fillT(t[1],q);if(seen.has(f)||ens.has(norm(e)))return;seen.add(f);ens.add(norm(e));opts.push(f)};

  const others=shuffle(P.filter(i=>i!==it&&key(i)!==key(it)&&norm(firstEn(i.en))!==norm(firstEn(it.en))&&norm(i.fr)!==norm(it.fr)));
  const sameList=others.filter(i=>i.list===it.list);others.sort((a,b)=>(a.list===it.list?0:9)-(b.list===it.list?0:9)||Math.abs(wc(a)-wc(it))-Math.abs(wc(b)-wc(it)));
  const opts=[],keys=new Set([key(it)]);for(const o of others){if(opts.length>=3)break;if(keys.has(key(o)))continue;keys.add(key(o));opts.push(show(o))}

  else if(ds.p){if(t.checked)state.plan.done[ds.p]=true;else delete state.plan.done[ds.p];save()}
  else if(ds.s){const [d,k]=ds.s.split(':');(state.plan.scores[d]=state.plan.scores[d]||{})[k]=t.value.trim();save()}
  else if(t.id==='pstart'&&t.value){state.plan.start=t.value;save();render()}
  else if(t.id==='diff'){state.diff=+t.value;save();toast('Boss difficulty saved.')}
});
document.addEventListener('input',e=>{if(e.target.id==='ans'){const c=$('#wc');if(c)c.textContent=words(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||view!=='session'||e.target.tagName==='TEXTAREA')return;if(sess.ph==='ask'&&e.target.id==='ans'){e.preventDefault();check()}else if(sess.ph==='fb'&&e.target.tagName!=='BUTTON'){e.preventDefault();next()}});
try{speechSynthesis.getVoices()}catch(e){}

load();render();initCloud();initAI();

</script>
</body>
</html>
